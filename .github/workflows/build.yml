name: DjStudio Multiplatform Build

on:
  workflow_dispatch: # Permite ejecutar el bot con un botón manual en GitHub

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Empaquetar Windows
        uses: actions/upload-artifact@v4
        with:
          name: DjStudio-Windows
          path: build\windows\x64\runner\Release\*

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - name: Empaquetar Android (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: DjStudio-Android-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  build-macos:
    name: Build macOS APP
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Empaquetar macOS
        uses: actions/upload-artifact@v4
        with:
          name: DjStudio-macOS
          path: build/macos/Build/Products/Release/djstudio_player.app