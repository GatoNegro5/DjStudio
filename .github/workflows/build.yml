name: DjStudio Master Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install dependencies
        run: flutter pub get
        
      - name: Generate Rust Bindings
        run: cargo install flutter_rust_bridge_codegen && flutter_rust_bridge_codegen generate
        
      - name: Build Windows Release
        run: flutter build windows --release
        
      - name: Inject FFmpeg for Zero-Install
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          Copy-Item "ffmpeg_extracted\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "build\windows\x64\runner\Release\"
          
      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: DjStudio_Windows_Portable
          path: build\windows\x64\runner\Release\*

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Setup Rust & Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
          
      - name: Install Cargo NDK
        run: cargo install cargo-ndk
        
      - name: Install dependencies
        run: flutter pub get

      - name: Generate Rust Bindings
        run: cargo install flutter_rust_bridge_codegen && flutter_rust_bridge_codegen generate
        
      - name: Bypass Gradle 8.x Groovy Error
        run: sed -i 's/gradle-[0-9\.]*-all\.zip/gradle-7.6.3-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
        
      - name: Build APK Release
        run: flutter build apk --release
        
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DjStudio_Android_APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    name: Build macOS Portable
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Setup Rust & Apple Architecture
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
        
      - name: Install dependencies
        run: flutter pub get
        
      - name: Generate Rust Bindings
        run: cargo install flutter_rust_bridge_codegen && flutter_rust_bridge_codegen generate
        
      - name: Build macOS Release
        run: flutter build macos --release
        
      - name: Inject FFmpeg (macOS Zero-Install)
        run: |
          curl -O https://evermeet.cx/ffmpeg/getrelease/zip
          unzip zip
          cp ffmpeg build/macos/Build/Products/Release/djstudio_player.app/Contents/MacOS/
          
      - name: Zip App Bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r DjStudio_Mac_Portable.zip djstudio_player.app
          
      - name: Upload macOS Portable
        uses: actions/upload-artifact@v4
        with:
          name: DjStudio_Mac_Portable
          path: build/macos/Build/Products/Release/DjStudio_Mac_Portable.zip